name: 매일 뉴스 자동 발행

# 매일 아침 08:00 KST 자동 실행 + 필요 시 수동 실행
on:
  schedule:
    # GitHub Actions cron은 UTC 기준. 08:00 KST = 23:00 UTC (전날)
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # 저장소 Actions 탭에서 '수동 실행' 가능

# 생성물 커밋(contents:write) + Pages 배포 권한
permissions:
  contents: write
  pages: write
  id-token: write

# 동시에 한 번만 배포
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스 수집 및 지면 생성
        run: python scripts/fetch_news.py

      # 생성된 지면을 저장소에 커밋(아카이브 + Pages 미사용 시에도 열람 가능)
      - name: 생성물 커밋
        run: |
          git config user.name "ETS News Bot"
          git config user.email "actions@github.com"
          git add public
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "자동 발행: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # Pages는 이미 활성화되어 있으므로 그대로 배포합니다.
      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 지면 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
