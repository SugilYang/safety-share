name: 매일 뉴스 자동 발행

# 매일 아침 08:00 KST 자동 실행 + 필요 시 수동 실행
on:
  schedule:
    # GitHub Actions cron은 UTC 기준. 08:00 KST = 23:00 UTC (전날)
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # 저장소 Actions 탭에서 '수동 실행' 가능
  push:
    branches: [ main, master ]
    paths:
      - "scripts/**"
      - ".github/workflows/daily-news.yml"

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 한 번만 배포
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스 수집 및 지면 생성
        run: python scripts/fetch_news.py

      - name: Pages 설정 (자동 활성화 포함)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 지면 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
