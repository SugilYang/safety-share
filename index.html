<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a2230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>블록시티</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a2230;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#fff;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%}

  .layer{position:fixed;inset:0;display:none;z-index:30}
  .layer.on{display:block}
  .center{display:flex;align-items:center;justify-content:center;flex-direction:column;height:100%;
    padding:20px calc(20px + env(safe-area-inset-left)) 20px calc(20px + env(safe-area-inset-right));
    text-align:center;overflow-y:auto}

  #lobby{background:linear-gradient(165deg,#27406b 0%,#1a2230 60%,#0e141c 100%)}
  #lobby h1{font-size:clamp(28px,8vw,48px);font-weight:800;letter-spacing:-1px}
  #lobby h1 span{color:#ffd24a}
  .sub{font-size:14px;color:#9fb3c8;margin:6px 0 24px;line-height:1.6}
  .card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    border-radius:20px;padding:22px 20px;width:min(430px,100%)}
  .pane{display:none}.pane.on{display:block}

  .btn{display:block;width:100%;border:0;border-radius:16px;padding:17px 16px;margin-top:12px;
    font-size:18px;font-weight:700;font-family:inherit;color:#12181f;background:#ffd24a;transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .btn.blue{background:#4f9cf9;color:#fff}
  .btn.ghost{background:rgba(255,255,255,.12);color:#dce7f2}
  .btn:disabled{opacity:.45}

  .code{font-size:clamp(44px,14vw,72px);font-weight:800;letter-spacing:12px;color:#ffd24a;margin:14px 0 6px;text-indent:12px}
  .hint{font-size:13px;color:#9fb3c8;line-height:1.7}
  .wait{font-size:15px;color:#7fd1a6;margin-top:14px}
  .wait.err{color:#ff8f8f}
  #codeInput{width:100%;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);border-radius:14px;
    color:#fff;font-size:40px;font-weight:800;text-align:center;letter-spacing:12px;padding:14px 0;font-family:inherit;text-indent:12px}
  #codeInput:focus{outline:0;border-color:#ffd24a}
  .colors{display:flex;gap:12px;justify-content:center;margin:16px 0 4px}
  .swatch{width:52px;height:52px;border-radius:50%;border:3px solid transparent}
  .swatch.sel{border-color:#fff;transform:scale(1.12)}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:10;
    padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left))}
  #hud.on{display:block}
  .hudTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .panel{background:rgba(0,0,0,.45);border-radius:12px;padding:8px 12px}
  #hpWrap{width:min(170px,38vw)}
  #hpBar{height:9px;background:rgba(255,255,255,.2);border-radius:5px;overflow:hidden;margin-top:5px}
  #hpFill{height:100%;width:100%;background:#5ddc7f;transition:width .18s}
  .lbl{font-size:10px;font-weight:700;color:#9fb3c8;letter-spacing:1px}
  #weapon{font-size:15px;font-weight:800}
  #tagBox{font-size:15px;font-weight:800;text-align:center}
  #tagBox.it{color:#ff6b6b}
  #tagBox.run{color:#7fd1a6}
  #speedo{font-size:14px;font-weight:800;text-align:right}

  /* ---------- 조작 ---------- */
  #stick{position:fixed;width:132px;height:132px;border-radius:50%;border:2px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.1);display:none;z-index:12;pointer-events:none;transform:translate(-50%,-50%)}
  #knob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;
    background:rgba(255,255,255,.55);transform:translate(-50%,-50%)}
  #pad{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));
    display:none;flex-direction:column;align-items:flex-end;gap:11px;z-index:12}
  #pad.on{display:flex}
  .row{display:flex;gap:11px;align-items:center}
  .key{border-radius:50%;background:rgba(255,255,255,.17);border:2px solid rgba(255,255,255,.32);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;text-align:center;line-height:1.1}
  .key.big{width:clamp(74px,18vw,96px);height:clamp(74px,18vw,96px);font-size:16px}
  .key.sm{width:clamp(58px,14vw,74px);height:clamp(58px,14vw,74px);font-size:13px}
  .key.atk{background:rgba(255,120,110,.32);border-color:rgba(255,120,110,.65)}
  .key.jmp{background:rgba(120,190,255,.3);border-color:rgba(120,190,255,.6)}
  .key.car{background:rgba(255,210,74,.3);border-color:rgba(255,210,74,.65)}
  .key.down{transform:scale(.92);filter:brightness(1.55)}
  .key.hide{display:none}

  #toast{position:fixed;left:50%;top:calc(78px + env(safe-area-inset-top));transform:translateX(-50%);
    background:rgba(0,0,0,.72);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:700;
    opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:14}
  #toast.on{opacity:1}
  #flash{position:fixed;inset:0;background:#ff3b3b;opacity:0;pointer-events:none;transition:opacity .25s;z-index:11}
  #downMsg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:rgba(0,0,0,.45);z-index:13;pointer-events:none}
  #downMsg.on{display:flex}
  #downMsg b{font-size:clamp(30px,9vw,54px);font-weight:800;color:#ff8f8f}
  #downMsg small{font-size:16px;color:#dce7f2;margin-top:8px;font-weight:600}

  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a2230;
    font-size:16px;color:#9fb3c8;z-index:60;text-align:center;padding:24px;line-height:1.7;white-space:pre-line}
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="lobby" class="layer on"><div class="center">
  <h1>블록<span>시티</span></h1>
  <p class="sub">아빠와 아들, 같은 도시에서 같이 놀기</p>
  <div class="card">
    <div id="pMenu" class="pane on">
      <button class="btn" id="bHost">방 만들기</button>
      <button class="btn blue" id="bJoin">코드로 참가하기</button>
      <button class="btn ghost" id="bSolo">혼자 둘러보기</button>
    </div>
    <div id="pHost" class="pane">
      <p class="hint">아들 폰에서 이 숫자를 입력하세요</p>
      <div class="code" id="roomCode">----</div>
      <button class="btn ghost" id="bCopy">참가 링크 복사하기</button>
      <p class="wait" id="hostWait">상대를 기다리는 중…</p>
      <button class="btn ghost" id="bHostBack">뒤로</button>
    </div>
    <div id="pJoin" class="pane">
      <p class="hint" style="margin-bottom:12px">아빠 폰에 뜬 숫자 4자리를 입력하세요</p>
      <input id="codeInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000">
      <button class="btn" id="bConnect">접속하기</button>
      <p class="wait" id="joinWait"></p>
      <button class="btn ghost" id="bJoinBack">뒤로</button>
    </div>
    <div id="pReady" class="pane">
      <p class="hint">내 캐릭터 색을 고르세요</p>
      <div class="colors" id="colors"></div>
      <button class="btn" id="bGo">시작!</button>
      <p class="wait" id="readyWait"></p>
    </div>
  </div>
</div></div>

<div id="hud">
  <div class="hudTop">
    <div class="panel" id="hpWrap">
      <div class="lbl">체력</div>
      <div id="hpBar"><div id="hpFill"></div></div>
      <div id="weapon" style="margin-top:6px">주먹</div>
    </div>
    <div class="panel" id="tagBox">－</div>
    <div class="panel" id="speedo" style="visibility:hidden">0 km/h</div>
  </div>
</div>

<div id="stick"><div id="knob"></div></div>

<div id="pad">
  <div class="row">
    <div class="key sm car ui hide" data-k="car">타기</div>
    <div class="key sm jmp ui" data-k="jump">점프</div>
  </div>
  <div class="row">
    <div class="key big atk ui" data-k="atk">주먹</div>
  </div>
</div>

<div id="toast"></div>
<div id="flash"></div>
<div id="downMsg"><b>쓰러졌다!</b><small id="downSec">3초 뒤 일어납니다</small></div>
<div id="boot">도시를 만드는 중…</div>

<script>
/* =====================================================================
   0. 라이브러리 로더
   ===================================================================== */
function loadScript(urls, done){
  let i = 0;
  (function next(){
    if (i >= urls.length) return done(new Error('fail'));
    const s = document.createElement('script');
    s.src = urls[i++];
    s.onload = () => done(null);
    s.onerror = next;
    document.head.appendChild(s);
  })();
}
let NET_OK = true;
loadScript([
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'
], err => {
  if (err){
    document.getElementById('boot').textContent =
      '3D 라이브러리를 불러오지 못했어요.\n인터넷 연결을 확인한 뒤 새로고침 해주세요.';
    return;
  }
  loadScript([
    'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'
  ], err2 => {
    NET_OK = !err2;
    try { boot(); }
    catch (e){
      document.getElementById('boot').textContent =
        '오류가 났어요 ▸ ' + (e && e.message ? e.message : String(e));
    }
  });
});

/* =====================================================================
   1. 설정
   ===================================================================== */
const BLOCKS = 6, BLOCK = 56, ROAD = 18;
const CELL = BLOCK + ROAD, CITY = BLOCKS * CELL, ORG = -CITY / 2;

const P = {                       // 사람
  radius:0.62, speed:8.4, runAnim:9, jump:11.2, grav:26, hpMax:100
};
const V = {                       // 자동차
  radius:2.3, accel:24, brake:34, top:34, rev:-11, drag:8, steer:1.9
};

const SKIN = [
  { name:'파랑', hex:0x3f8ce8 }, { name:'빨강', hex:0xe8503f },
  { name:'초록', hex:0x43b562 }, { name:'보라', hex:0x9a5fd4 }
];

// 무기: 사거리(m), 피해, 쿨타임(초), 투척 여부
const WEAPONS = {
  fist:    { name:'주먹',     range:2.3, dmg:12, cd:0.34, throw:false },
  kick:    { name:'발차기',   range:2.6, dmg:18, cd:0.52, throw:false },
  bat:     { name:'야구방망이', range:3.2, dmg:30, cd:0.60, throw:false },
  balloon: { name:'물풍선',   range:0,   dmg:15, cd:0.55, throw:true, ammo:6, speed:26 },
  blaster: { name:'블래스터', range:0,   dmg:20, cd:0.28, throw:true, ammo:20, speed:52 }
};
const PICKUP_KINDS = ['bat', 'balloon', 'blaster'];

/* 두 폰에서 도시가 똑같이 만들어져야 하므로 고정 씨앗 난수를 쓴다 */
function mulberry32(a){
  return function(){
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* =====================================================================
   2. 전역
   ===================================================================== */
let renderer, scene, camera;
let me, foe;                      // 플레이어 2명
let buildings = [], cars = [], pickups = [], shots = [];
let camYaw = 0, camPitch = 0.34;
const TAU = Math.PI * 2;
let _v1, _v2;

const $ = id => document.getElementById(id);

/* =====================================================================
   3. 도시 만들기
   ===================================================================== */
function boot(){
  _v1 = new THREE.Vector3(); _v2 = new THREE.Vector3();

  const canvas = $('gl');
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fc6ea);
  scene.fog = new THREE.Fog(0x8fc6ea, 120, 400);

  camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.4, 800);

  scene.add(new THREE.HemisphereLight(0xdff0ff, 0x5a6b4a, 1.0));
  const sun = new THREE.DirectionalLight(0xfff4dc, 0.8);
  sun.position.set(90, 160, 50);
  scene.add(sun);

  buildCity();
  buildCars();
  buildPickups();
  makeNpcs();

  me  = makePlayer(SKIN[0].hex, true);
  foe = makePlayer(SKIN[1].hex, false);
  setPlayerVisible(foe, false);

  addEventListener('resize', onResize);
  onResize();
  bindInput();
  bindUI();
  respawn(me, 0);
  respawn(foe, 1);

  $('boot').style.display = 'none';

  const q = new URLSearchParams(location.search).get('room');
  if (q && /^\d{4}$/.test(q) && NET_OK){
    showPane('pJoin'); $('codeInput').value = q; joinRoom(q);
  }
  requestAnimationFrame(loop);
}

function onResize(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

/* 블록 i 의 x(또는 z) 범위 */
function blockLo(i){ return ORG + i * CELL + ROAD / 2; }

function buildCity(){
  const rnd = mulberry32(20260914);

  // 바닥(도로)
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(CITY + 80, CITY + 80),
    new THREE.MeshLambertMaterial({ color:0x4a4f57 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  /* 차선·인도·건물·나무는 개수가 많다. 하나씩 그리면 그리기 명령이 1000번을
     넘어가 폰에서 버벅이므로, 종류별로 한 번에 그리도록(InstancedMesh) 묶는다. */
  const laneA = [], laneB = [], paveL = [], grassL = [], treeL = [], bldL = [], rimL = [];

  for (let i = 0; i <= BLOCKS; i++){
    const c = ORG + i * CELL;                        // 도로 중심선
    for (let t = -CITY / 2; t < CITY / 2; t += 9){
      laneA.push([c, t]); laneB.push([t, c]);
    }
  }

  const wallCols = [0xc9b79a, 0xa8b8c6, 0xd0a08a, 0x9fb59a, 0xbfb0c4, 0xcdc2a5];

  for (let i = 0; i < BLOCKS; i++){
    for (let j = 0; j < BLOCKS; j++){
      const x0 = blockLo(i), z0 = blockLo(j);
      paveL.push([x0 + BLOCK / 2, z0 + BLOCK / 2]);                 // 인도

      if (rnd() < 0.22){                                            // 공원 블록
        grassL.push([x0 + BLOCK / 2, z0 + BLOCK / 2]);
        for (let k = 0; k < 8; k++)
          treeL.push([x0 + 5 + rnd() * (BLOCK - 10),
                      z0 + 5 + rnd() * (BLOCK - 10), 0.8 + rnd() * 0.5]);
        continue;
      }

      // 블록을 2×2 로 나눠 건물 배치 (일부 칸은 비움)
      const half = BLOCK / 2;
      for (let a = 0; a < 2; a++){
        for (let b = 0; b < 2; b++){
          if (rnd() < 0.18) continue;
          const pad = 2 + rnd() * 3;
          const bx0 = x0 + a * half + pad, bz0 = z0 + b * half + pad;
          const w = half - pad * 2, d = half - pad * 2;
          const h = 9 + rnd() * 34;
          bldL.push([bx0 + w / 2, h / 2, bz0 + d / 2, w, h, d,
                     wallCols[(rnd() * wallCols.length) | 0]]);
          rimL.push([bx0 + w / 2, h + 0.35, bz0 + d / 2, w + 0.8, 0.7, d + 0.8]);
          buildings.push({ x0:bx0, x1:bx0 + w, z0:bz0, z1:bz0 + d, top:h + 0.7 });
        }
      }
    }
  }

  const flat = (w, h) => { const g = new THREE.PlaneGeometry(w, h); g.rotateX(-Math.PI / 2); return g; };
  const trunkG = new THREE.CylinderGeometry(0.4, 0.55, 3, 6); trunkG.translate(0, 1.5, 0);
  const leafG  = new THREE.BoxGeometry(4.6, 4.2, 4.6);        leafG.translate(0, 5.2, 0);

  putFlat(flat(0.5, 3.2), 0xdedede, laneA, 0.02, true);            // 세로 도로 차선
  putFlat(flat(3.2, 0.5), 0xdedede, laneB, 0.02, true);            // 가로 도로 차선
  putFlat(flat(BLOCK + 5, BLOCK + 5), 0x8d9199, paveL, 0.04);
  putFlat(flat(BLOCK, BLOCK), 0x62a04c, grassL, 0.06);
  putScaled(trunkG, 0x74522f, treeL);
  putScaled(leafG,  0x3f8f45, treeL);
  putBoxes(bldL, rimL);

  // 옥상으로 올라갈 수 있는 경사로 몇 개
  for (let k = 0; k < 10; k++){
    const i = (rnd() * BLOCKS) | 0, j = (rnd() * BLOCKS) | 0;
    const x = blockLo(i) + BLOCK / 2, z = blockLo(j) - ROAD / 2 - 1;
    addRamp(x, z, rnd() < 0.5 ? 0 : Math.PI / 2);
  }
}

/* ---- 같은 모양 여러 개를 한 번에 그리기 ---- */
function putFlat(geo, color, list, y, basic){          // 위치만 다른 바닥 판
  if (!list.length) return;
  const mat = basic ? new THREE.MeshBasicMaterial({ color })
                    : new THREE.MeshLambertMaterial({ color });
  const im = new THREE.InstancedMesh(geo, mat, list.length);
  const M = new THREE.Matrix4();
  list.forEach((p, k) => { M.identity(); M.setPosition(p[0], y, p[1]); im.setMatrixAt(k, M); });
  im.instanceMatrix.needsUpdate = true;
  scene.add(im);
}

function putScaled(geo, color, list){                  // 위치 + 크기가 다른 것 (나무)
  if (!list.length) return;
  const im = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color }), list.length);
  const M = new THREE.Matrix4();
  list.forEach((p, k) => {
    M.makeScale(p[2], p[2], p[2]); M.setPosition(p[0], 0, p[1]); im.setMatrixAt(k, M);
  });
  im.instanceMatrix.needsUpdate = true;
  scene.add(im);
}

function putBoxes(bldL, rimL){                         // 건물 (색이 제각각) + 옥상 테두리
  const box = new THREE.BoxGeometry(1, 1, 1);
  const M = new THREE.Matrix4(), C = new THREE.Color();
  if (bldL.length){
    const bm = new THREE.InstancedMesh(box, new THREE.MeshLambertMaterial({}), bldL.length);
    bldL.forEach((b, k) => {
      M.makeScale(b[3], b[4], b[5]); M.setPosition(b[0], b[1], b[2]);
      bm.setMatrixAt(k, M); bm.setColorAt(k, C.setHex(b[6]));
    });
    bm.instanceMatrix.needsUpdate = true;
    if (bm.instanceColor) bm.instanceColor.needsUpdate = true;
    scene.add(bm);
  }
  if (rimL.length){
    const rm = new THREE.InstancedMesh(box, new THREE.MeshLambertMaterial({ color:0x6f757e }), rimL.length);
    rimL.forEach((b, k) => {
      M.makeScale(b[3], b[4], b[5]); M.setPosition(b[0], b[1], b[2]); rm.setMatrixAt(k, M);
    });
    rm.instanceMatrix.needsUpdate = true;
    scene.add(rm);
  }
}

// 달려 올라가는 점프대
function addRamp(x, z, rot){
  const g = new THREE.BoxGeometry(9, 0.6, 14);
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color:0xe0b23c }));
  m.position.set(x, 1.7, z);
  m.rotation.y = rot;
  m.rotation.x = -0.24;
  scene.add(m);
  ramps.push({ x, z, rot, len:14, w:9, h:3.4 });
}
const ramps = [];

/* ---- 탈것 종류 ---- */
const VEHICLES = {
  sedan:  { name:'승용차',   bike:false, w:2.3, h:0.9, l:4.6, r:2.3, top:34, accel:24, steer:1.9,
            col:[0xe0473a, 0x3a7fe0, 0xf0c33a, 0x46b262, 0xe8e8e8] },

function buildCars(){
  const rnd = mulberry32(777);
  for (let k = 0; k < VEH_MIX.length; k++){
    const type = VEH_MIX[k];
    const spec = VEHICLES[type];
    const onX = rnd() < 0.5;
    const road = ORG + ((rnd() * (BLOCKS + 1)) | 0) * CELL;
    const along = ORG + 14 + rnd() * (CITY - 28);
    const side = (rnd() < 0.5 ? -1 : 1) * (spec.bike ? 5.5 : 4.2);
    const v = makeVehicle(type, spec.col[(rnd() * spec.col.length) | 0]);
    v.x = onX ? road + side : along;
    v.z = onX ? along : road + side;
    v.yaw = onX ? 0 : Math.PI / 2;
    cars.push(v);
  }
}

function makeVehicle(type, hex){
  const s = VEHICLES[type];
  const g = new THREE.Group();
  const paint = new THREE.MeshLambertMaterial({ color:hex });
  const dark  = new THREE.MeshLambertMaterial({ color:0x2a3038 });
  const glass = new THREE.MeshLambertMaterial({ color:0xa9dcff });
  const wheelG = new THREE.CylinderGeometry(1, 1, 1, 10);
  wheelG.rotateZ(Math.PI / 2);

  const wheel = (x, y, z, rad, wid) => {
    const w = new THREE.Mesh(wheelG, dark);
    w.scale.set(rad, wid, rad);
    w.position.set(x, y, z);
    g.add(w);
  };

  if (s.bike){
    const body = new THREE.Mesh(new THREE.BoxGeometry(s.w, s.h, s.l), paint);
    body.position.y = 0.95; g.add(body);
    const seat = new THREE.Mesh(new THREE.BoxGeometry(s.w + 0.15, 0.22, 0.9), dark);
    seat.position.set(0, 1.3, -0.25); g.add(seat);
    const bar = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.14, 0.14), dark);
    bar.position.set(0, 1.5, s.l / 2 - 0.25); g.add(bar);
    const light = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.3, 0.2),
      new THREE.MeshBasicMaterial({ color:0xfff3b0 }));
    light.position.set(0, 1.25, s.l / 2); g.add(light);
    wheel(0, 0.62, s.l / 2 - 0.35, 0.62, 0.24);
    wheel(0, 0.62, -s.l / 2 + 0.35, 0.62, 0.24);
  } else {
    const body = new THREE.Mesh(new THREE.BoxGeometry(s.w, s.h, s.l), paint);
    body.position.y = 0.62 + s.h / 2; g.add(body);
    const cabL = type === 'truck' ? 2.0 : type === 'van' ? 3.2 : 2.2;
    const cab = new THREE.Mesh(new THREE.BoxGeometry(s.w - 0.3, 0.85, cabL), glass);
    cab.position.set(0, 0.62 + s.h + 0.42, type === 'truck' ? s.l / 2 - cabL / 2 - 0.3 : -0.2);
    g.add(cab);
    if (type === 'truck'){                                   // 짐칸
      const bed = new THREE.Mesh(new THREE.BoxGeometry(s.w, 1.0, s.l - cabL - 0.8), dark);
      bed.position.set(0, 0.62 + s.h + 0.5, -cabL / 2 - 0.2); g.add(bed);
    }
    const wx = s.w / 2 - 0.15, wz = s.l / 2 - 1.2;
    for (const [a, b] of [[-wx, wz], [wx, wz], [-wx, -wz], [wx, -wz]]) wheel(a, 0.62, b, 0.62, 0.42);
  }
  scene.add(g);
  return { mesh:g, type, spec:s, x:0, z:0, yaw:0, speed:0, driver:-1, paint };
}

// 다음 목적지를 이웃 교차로로 (길 위를 따라 걷게)
function npcRetarget(n){
  const d = (Math.random() * 4) | 0;
  if (d === 0) n.gi = Math.min(BLOCKS, n.gi + 1);
  else if (d === 1) n.gi = Math.max(0, n.gi - 1);
  else if (d === 2) n.gj = Math.min(BLOCKS, n.gj + 1);
  else n.gj = Math.max(0, n.gj - 1);
  n.tx = ORG + n.gi * CELL; n.tz = ORG + n.gj * CELL;
}

// 넘어뜨리기 (0.state: 0 걷기 / 1 넘어짐 / 2 도망)
function knockNpc(i, dx, dz){
  const n = npcs[i];
  if (!n || n.state === 1) return;
  n.state = 1; n.t = 2.5;
  n.vx = dx * 11; n.vz = dz * 11;
  n.fx = n.x - dx * 10; n.fz = n.z - dz * 10;      // 때린 쪽 = 도망칠 반대 방향
}

function knockNpcsNear(x, z, r, dx, dz){
  for (let i = 0; i < npcs.length; i++){
    const n = npcs[i];
    if (n.state === 1) continue;
    if (Math.hypot(n.x - x, n.z - z) > r) continue;
    knockNpc(i, dx, dz);
    if (mode === 'guest') send({ t:'nhit', i, dx, dz });
  }
}

function updateNpcs(dt){
  for (const n of npcs){
    if (n.state === 1){                              // 넘어져 있는 동안
      n.t -= dt;
      n.x += n.vx * dt; n.z += n.vz * dt;
      n.vx *= 0.87; n.vz *= 0.87;
      if (n.t <= 0){ n.state = 2; n.t = 3.5; }
    } else {
      let tx, tz, sp;
      if (n.state === 2){                            // 놀라서 도망
        n.t -= dt;
        tx = n.x + (n.x - n.fx); tz = n.z + (n.z - n.fz); sp = 7.2;
        if (n.t <= 0){ n.state = 0; npcRetarget(n); }
      } else {
        tx = n.tx; tz = n.tz; sp = 3.4;
        if (Math.hypot(tx - n.x, tz - n.z) < 2.5) npcRetarget(n);
      }
      let dx = tx - n.x, dz = tz - n.z;
      const d = Math.hypot(dx, dz) || 1;
      dx /= d; dz /= d;
      n.x += dx * sp * dt; n.z += dz * sp * dt;
      n.yaw = Math.atan2(dx, dz);
      n.animT += dt * sp * 1.5;
    }
    collideBoxes(n, 0.55);
  }
}

// 참가자 쪽은 방장이 보내준 위치로 부드럽게 따라간다
function smoothNpcs(dt){
  const k = 1 - Math.exp(-dt * 10);
  for (const n of npcs){
    if (n.ttx === undefined) continue;
    n.x += (n.ttx - n.x) * k; n.z += (n.ttz - n.z) * k;
    if (n.state !== 1) n.animT += dt * 5;
  }
}

function drawNpcs(){
  for (const n of npcs){
    n.root.position.set(n.x, 0, n.z);
    n.root.rotation.y = n.yaw;
    if (n.state === 1){
      n.root.rotation.x = -1.2;
      n.armL.rotation.x = n.armR.rotation.x = 1.3;
      n.legL.rotation.x = n.legR.rotation.x = 0.2;
    } else {
      n.root.rotation.x = 0;
      const sw = Math.sin(n.animT) * 0.7;
      n.legL.rotation.x = sw; n.legR.rotation.x = -sw;
      n.armL.rotation.x = -sw; n.armR.rotation.x = sw;
    }
  }
}

   ===================================================================== */
function groundAt(x, z, y){
  let g = 0;
  for (const b of buildings){
    if (x > b.x0 && x < b.x1 && z > b.z0 && z < b.z1 && b.top <= y + 0.55 && b.top > g) g = b.top;
  }
  for (const r of ramps){                       // 경사로 위
    const dx = x - r.x, dz = z - r.z;
    const lx = r.rot === 0 ? dx : dz, lz = r.rot === 0 ? dz : -dx;
    if (Math.abs(lx) < r.w / 2 && Math.abs(lz) < r.len / 2){
      const h = 1.7 + (-lz / r.len) * r.h;
      if (h > g && h <= y + 1.2) g = h;
    }
  }
  return g;
}

function collideBoxes(o, radius){
  for (const b of buildings){
    if (o.y >= b.top - 0.25) continue;                       // 옥상 위면 통과
    const cx = clamp(o.x, b.x0, b.x1), cz = clamp(o.z, b.z0, b.z1);
    let dx = o.x - cx, dz = o.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 >= radius * radius) continue;
    let d = Math.sqrt(d2);
    if (d < 1e-4){                                           // 완전히 안쪽이면 가까운 면으로
      const toL = o.x - b.x0, toR = b.x1 - o.x, toD = o.z - b.z0, toU = b.z1 - o.z;
      const m = Math.min(toL, toR, toD, toU);
      if (m === toL) o.x = b.x0 - radius; else if (m === toR) o.x = b.x1 + radius;
      else if (m === toD) o.z = b.z0 - radius; else o.z = b.z1 + radius;
      continue;
    }
    o.x = cx + dx / d * radius; o.z = cz + dz / d * radius;
  }
  const lim = CITY / 2 + 30;
  o.x = clamp(o.x, -lim, lim); o.z = clamp(o.z, -lim, lim);
}

/* =====================================================================
   6. 입력 (조이스틱 + 시점 + 버튼)
   ===================================================================== */
const btn = { jump:false, atk:false, car:false };
let joyId = -1, joyBX = 0, joyBY = 0, joyX = 0, joyY = 0;
let lookId = -1, lookX = 0, lookY = 0;

function bindInput(){
  document.querySelectorAll('.key').forEach(el => {
    const k = el.dataset.k;
    const on  = e => { e.preventDefault(); e.stopPropagation(); btn[k] = true;  el.classList.add('down'); };
    const off = e => { e.preventDefault(); e.stopPropagation(); btn[k] = false; el.classList.remove('down'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  });

  addEventListener('pointerdown', e => {
    if (e.target && e.target.closest && e.target.closest('.ui')) return;
    if (e.clientX < innerWidth * 0.45 && joyId < 0){
      joyId = e.pointerId; joyBX = e.clientX; joyBY = e.clientY; joyX = joyY = 0;
      const s = $('stick'); s.style.display = 'block';
      s.style.left = joyBX + 'px'; s.style.top = joyBY + 'px';
      $('knob').style.left = '50%'; $('knob').style.top = '50%';
    } else if (lookId < 0){
      lookId = e.pointerId; lookX = e.clientX; lookY = e.clientY;
    }
  });

  addEventListener('pointermove', e => {
    if (e.pointerId === joyId){
      const dx = e.clientX - joyBX, dy = e.clientY - joyBY, R = 58;
      const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / R);
      joyX = dx / d * k; joyY = dy / d * k;
      $('knob').style.left = (50 + joyX * 45) + '%';
      $('knob').style.top  = (50 + joyY * 45) + '%';
    } else if (e.pointerId === lookId){
      camYaw   -= (e.clientX - lookX) * 0.006;
      camPitch  = clamp(camPitch + (e.clientY - lookY) * 0.004, -0.15, 1.05);
      lookX = e.clientX; lookY = e.clientY;
    }
  });

  const up = e => {
    if (e.pointerId === joyId){ joyId = -1; joyX = joyY = 0; $('stick').style.display = 'none'; }
    if (e.pointerId === lookId) lookId = -1;
  };
  addEventListener('pointerup', up);
  addEventListener('pointercancel', up);

  // PC 테스트용
  const KM = { w:'f', s:'b', a:'l', d:'r', ArrowUp:'f', ArrowDown:'b', ArrowLeft:'l', ArrowRight:'r' };
  const kb = { f:false, b:false, l:false, r:false };
  addEventListener('keydown', e => {
    if (KM[e.key]) kb[KM[e.key]] = true;
    if (e.key === ' ') btn.jump = true;
    if (e.key === 'j') btn.atk = true;
    if (e.key === 'e') btn.car = true;
    syncKb();
  });
  addEventListener('keyup', e => {
    if (KM[e.key]) kb[KM[e.key]] = false;
    if (e.key === ' ') btn.jump = false;
    if (e.key === 'j') btn.atk = false;
    if (e.key === 'e') btn.car = false;
    syncKb();
  });
  function syncKb(){
    if (joyId >= 0) return;
    joyX = (kb.r ? 1 : 0) - (kb.l ? 1 : 0);
    joyY = (kb.b ? 1 : 0) - (kb.f ? 1 : 0);
  }
}

function respawn(p, idx){
  p.x = ORG + CELL * (idx === 0 ? 1 : 2);
  p.z = ORG + CELL * 1.5;
  p.y = 0; p.vy = 0; p.hp = P.hpMax; p.down = false; p.downT = 0;
  p.weapon = 'fist'; p.ammo = 0; p.car = -1; p.anim = 0;
}

function updateMe(dt){
  if (me.tagCool > 0) me.tagCool -= dt;
  if (me.atkT > 0) me.atkT -= dt;

  if (me.down){                                    // 쓰러진 상태
    me.downT -= dt;
    $('downSec').textContent = Math.max(0, Math.ceil(me.downT)) + '초 뒤 일어납니다';
    if (me.downT <= 0){
      me.down = false; me.hp = P.hpMax; me.weapon = 'fist'; me.ammo = 0;
      $('downMsg').classList.remove('on');
    }
    return;
  }

  if (me.car >= 0) driveCar(dt);
  else walk(dt);

  // 무기 줍기
  for (const pk of pickups){
    if (pk.cool > 0){ pk.cool -= dt; pk.mesh.visible = pk.cool <= 0; continue; }
    if (me.car >= 0) continue;
    if (Math.hypot(me.x - pk.x, me.z - pk.z) < 1.6 && Math.abs(me.y) < 3){
      me.weapon = pk.kind;
      me.ammo = WEAPONS[pk.kind].ammo || 0;
      pk.cool = 20; pk.mesh.visible = false;
      toast(WEAPONS[pk.kind].name + ' 획득!');
    }
  }

  if (btn.atk && me.car < 0) attack();
  handleCarButton();
  if (me.it) tryTag();
}

function walk(dt){
  const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
  const rx = -Math.cos(camYaw), rz = Math.sin(camYaw);
  let mx = rx * joyX + fx * (-joyY);
  let mz = rz * joyX + fz * (-joyY);
  const len = Math.hypot(mx, mz);

  if (len > 0.08){
    mx /= len; mz /= len;
    const sp = P.speed * Math.min(1, len);
    me.x += mx * sp * dt; me.z += mz * sp * dt;
    const want = Math.atan2(mx, mz);
    let d = want - me.yaw;
    while (d > Math.PI) d -= TAU;
    while (d < -Math.PI) d += TAU;
    me.yaw += d * Math.min(1, dt * 14);
    me.anim = 1; me.animT += dt * P.runAnim * Math.min(1, len);
  } else {
    me.anim = 0;
  }

  collideBoxes(me, P.radius);

  const g = groundAt(me.x, me.z, me.y);
  if (me.onGround && btn.jump){ me.vy = P.jump; me.onGround = false; }
  me.vy -= P.grav * dt;
  me.y += me.vy * dt;
  if (me.y <= g){ me.y = g; me.vy = 0; me.onGround = true; }
  else { me.onGround = false; me.anim = 2; }
}

/* ---- 자동차 ---- */
function handleCarButton(){
  const near = nearestCar();
  const b = document.querySelector('[data-k="car"]');
  if (me.car >= 0){ b.classList.remove('hide'); b.textContent = '내리기'; }
  else if (near >= 0){ b.classList.remove('hide'); b.textContent = cars[near].spec.name; }
  else b.classList.add('hide');

  if (!btn.car || handleCarButton.lock) return;
  handleCarButton.lock = true;
  setTimeout(() => handleCarButton.lock = false, 350);

  if (me.car >= 0){                                  // 내리기
    const c = cars[me.car];
    c.driver = -1;
    me.x = c.x - Math.cos(c.yaw) * 2.6; me.z = c.z + Math.sin(c.yaw) * 2.6;
    me.y = 0; me.car = -1; me.onBike = false;
    setPlayerVisible(me, true);
    send({ t:'car', i:-1 });
  } else if (near >= 0){                             // 타기
    me.car = near; cars[near].driver = 0;
    me.onBike = cars[near].spec.bike;                // 오토바이는 탄 모습이 보인다
    setPlayerVisible(me, me.onBike);
    toast(cars[near].spec.name + ' 탑승!');
    send({ t:'car', i:near });
  }
}

function nearestCar(){
  if (me.car >= 0) return -1;
  let best = -1, bd = 4.5;
  for (let i = 0; i < cars.length; i++){
    if (cars[i].driver >= 0) continue;
    const d = Math.hypot(cars[i].x - me.x, cars[i].z - me.z);
    if (d < bd){ bd = d; best = i; }
  }
  return best;
}

function driveCar(dt){
  const c = cars[me.car], s = c.spec;
  const th = -joyY;                                  // 위로 밀면 전진
  if (th > 0.1) c.speed += s.accel * th * dt;
  else if (th < -0.1) c.speed += (c.speed > 0 ? -V.brake : s.accel * 0.6) * Math.abs(th) * dt;
  else c.speed -= Math.sign(c.speed) * V.drag * dt;
  if (Math.abs(c.speed) < 0.3 && Math.abs(th) < 0.1) c.speed = 0;
  c.speed = clamp(c.speed, V.rev, s.top);

  if (Math.abs(joyX) > 0.08){
    const grip = Math.min(1, Math.abs(c.speed) / (s.bike ? 5 : 9));
    c.yaw -= joyX * s.steer * grip * dt * Math.sign(c.speed || 1);
  }
  c.x += Math.sin(c.yaw) * c.speed * dt;
  c.z += Math.cos(c.yaw) * c.speed * dt;
  const before = c.x + c.z;
  collideBoxes(c, s.r);
  if (Math.abs(c.x + c.z - before) > 0.01) c.speed *= 0.35;    // 부딪히면 감속

  // 달리는 차/오토바이에 치이면 행인이 넘어진다
  if (Math.abs(c.speed) > 8) knockNpcsNear(c.x, c.z, s.r + 1.2, Math.sin(c.yaw), Math.cos(c.yaw));

  me.x = c.x; me.z = c.z; me.y = 0; me.yaw = c.yaw;
}

/* =====================================================================
   8. 싸움
   ===================================================================== */
function attack(){
  if (me.atkT > 0) return;
  let w = me.weapon;
  if (w === 'fist'){ me.combo = (me.combo + 1) % 2; w = me.combo ? 'fist' : 'kick'; }
  const spec = WEAPONS[w];
  me.atkT = spec.cd; me.atkKind = w;
  send({ t:'atk', k:w });

  if (spec.throw){
    if (me.ammo <= 0){ me.weapon = 'fist'; toast('다 썼어요 — 주먹으로!'); return; }
    me.ammo--;
    if (me.ammo <= 0) setTimeout(() => { me.weapon = 'fist'; }, 300);
    const dx = Math.sin(me.yaw), dz = Math.cos(me.yaw);
    spawnShot(me.x + dx * 1.2, me.y + 1.9, me.z + dz * 1.2,
              dx * spec.speed, 2.5, dz * spec.speed, w, true);
    send({ t:'shot', x:me.x + dx * 1.2, y:me.y + 1.9, z:me.z + dz * 1.2,
           dx:dx * spec.speed, dz:dz * spec.speed, k:w });
    return;
  }

  // 근접 공격 판정 — 행인이 먼저 맞을 수도 있다
  meleeNpcs(spec);
  if (!foe.root.visible || foe.down) return;
  const dx = foe.x - me.x, dz = foe.z - me.z;
  const dist = Math.hypot(dx, dz);
  if (dist > spec.range || Math.abs(foe.y - me.y) > 2.4) return;
  const dot = (dx / dist) * Math.sin(me.yaw) + (dz / dist) * Math.cos(me.yaw);
  if (dot < 0.45) return;                                       // 앞쪽만
  hitFoe(spec.dmg, dx / dist, dz / dist);
}

function meleeNpcs(spec){
  const sx = Math.sin(me.yaw), sz = Math.cos(me.yaw);
  for (let i = 0; i < npcs.length; i++){
    const n = npcs[i];
    if (n.state === 1) continue;
    const dx = n.x - me.x, dz = n.z - me.z;
    const d = Math.hypot(dx, dz);
    if (d > spec.range + 0.5 || d < 0.01) continue;
    if ((dx / d) * sx + (dz / d) * sz < 0.45) continue;      // 앞쪽만
    knockNpc(i, dx / d, dz / d);
    if (mode === 'guest') send({ t:'nhit', i, dx:dx / d, dz:dz / d });
    toast('아야!', 700);
    return true;
  }
  return false;
}

function hitFoe(dmg, kx, kz){
  send({ t:'hit', d:dmg, kx, kz });
  toast('명중!', 800);
}

function spawnShot(x, y, z, vx, vz, kind, mine){
  const col = kind === 'balloon' ? 0x4fc3f7 : 0xff6ad5;
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.32, 8, 6),
    new THREE.MeshBasicMaterial({ color:col }));
  m.position.set(x, y, z);
  scene.add(m);
  shots.push({ mesh:m, x, y, z, vx, vy:2.5, vz, kind, mine, life:2.4 });
}

function updateShots(dt){
  for (let i = shots.length - 1; i >= 0; i--){
    const s = shots[i];
    s.life -= dt;
    s.vy -= 22 * dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
    s.mesh.position.set(s.x, s.y, s.z);

    let gone = s.life <= 0 || s.y < 0.1;
    if (!gone && s.mine){                                   // 행인에게 맞았나
      for (let j = 0; j < npcs.length; j++){
        const n = npcs[j];
        if (n.state === 1) continue;
        if (Math.hypot(s.x - n.x, s.z - n.z) < 1.2 && s.y < 2.6){
          const d = Math.hypot(s.vx, s.vz) || 1;
          knockNpc(j, s.vx / d, s.vz / d);
          if (mode === 'guest') send({ t:'nhit', i:j, dx:s.vx / d, dz:s.vz / d });
          gone = true; break;
        }
      }
    }
    if (!gone && s.mine && foe.root.visible && !foe.down){
      if (Math.hypot(s.x - foe.x, s.z - foe.z) < 1.3 && Math.abs(s.y - (foe.y + 1.4)) < 1.6){
        const d = Math.hypot(s.vx, s.vz) || 1;
        hitFoe(WEAPONS[s.kind].dmg, s.vx / d, s.vz / d);
        gone = true;
      }
    }
    if (gone){ scene.remove(s.mesh); shots.splice(i, 1); }
  }
}

function takeDamage(dmg, kx, kz){
  if (me.down) return;
  me.hp -= dmg;
  me.kx = kx * 9; me.kz = kz * 9;
  $('flash').style.opacity = '0.35';
  setTimeout(() => $('flash').style.opacity = '0', 90);
  if (me.hp <= 0){
    me.hp = 0; me.down = true; me.downT = 3;
    if (me.car >= 0){ cars[me.car].driver = -1; me.car = -1; setPlayerVisible(me, true); }
    $('downMsg').classList.add('on');
    send({ t:'down' });
  }
}

/* =====================================================================
   9. 술래잡기
   ===================================================================== */
function tryTag(){
  if (me.tagCool > 0 || !foe.root.visible || foe.down) return;
  if (Math.hypot(foe.x - me.x, foe.z - me.z) < 2.4 && Math.abs(foe.y - me.y) < 2.6){
    me.it = false; foe.it = true; me.tagCool = 3;
    send({ t:'tag' });
    toast('잡았다! 이제 상대가 술래');
  }
}

/* =====================================================================
   10. 그리기
   ===================================================================== */
function drawPlayer(p, dt){
  p.root.position.set(p.x, p.y + (p.onBike ? 1.05 : 0), p.z);
  p.root.rotation.y = p.yaw;
  p.crown.visible = p.it;

  if (p.onBike && !p.down){                                     // 오토바이에 앉은 자세
    p.root.rotation.x = 0;
    p.legL.rotation.x = p.legR.rotation.x = -1.15;
    p.armL.rotation.x = p.armR.rotation.x = -1.1;
  } else if (p.down){
    p.root.rotation.x = -1.25;                                  // 뒤로 넘어짐
    p.armL.rotation.x = p.armR.rotation.x = 1.4;
    p.legL.rotation.x = p.legR.rotation.x = 0.3;
  } else {
    p.root.rotation.x = 0;
    const sw = p.anim === 1 ? Math.sin(p.animT) * 0.75 : 0;
    p.legL.rotation.x = sw; p.legR.rotation.x = -sw;
    p.armL.rotation.x = -sw; p.armR.rotation.x = sw;
    if (p.anim === 2){ p.armL.rotation.x = p.armR.rotation.x = -2.2; }
    if (p.atkT > 0){                                            // 공격 동작
      const k = p.atkKind;
      if (k === 'kick') p.legR.rotation.x = -1.5;
      else p.armR.rotation.x = -1.9;
    }
  }
  p.shadow.position.set(p.x, groundAt(p.x, p.z, p.y) + 0.05, p.z);
  p.shadow.material.opacity = Math.max(0, 0.42 - (p.y - groundAt(p.x, p.z, p.y)) * 0.05);
}

function drawCars(){
  for (const c of cars){
    c.mesh.position.set(c.x, 0, c.z);
    c.mesh.rotation.y = c.yaw;
  }
}

function updateCamera(dt){
  const inCar = me.car >= 0;
  if (inCar && lookId < 0){                                     // 운전 중엔 차 뒤로 자동 정렬
    let d = cars[me.car].yaw - camYaw;
    while (d > Math.PI) d -= TAU;
    while (d < -Math.PI) d += TAU;
    camYaw += d * Math.min(1, dt * 2.4);
  }
  const dist = inCar ? 12.5 : 8.2, hgt = inCar ? 1.6 : 1.9;
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  _v1.set(me.x - Math.sin(camYaw) * dist * cp,
          me.y + hgt + dist * sp,
          me.z - Math.cos(camYaw) * dist * cp);
  if (_v1.y < 1.2) _v1.y = 1.2;
  camera.position.lerp(_v1, 1 - Math.exp(-dt * 12));
  _v2.set(me.x, me.y + (inCar ? 1.6 : 1.9), me.z);
  camera.lookAt(_v2);
}

/* =====================================================================
   11. 통신
   ===================================================================== */
let peer = null, conn = null, mode = 'solo', isHost = false;
let myColor = 0, foeColor = 1, myReady = false, foeReady = false;
let foeTarget = null, lastSend = 0;
const PEER_PREFIX = 'blockcity-kr-';

function send(o){ if (conn && conn.open){ try { conn.send(o); } catch(e){} } }

function showPane(id){ document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === id)); }
function toast(msg, ms){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms || 1800);
}

function hostRoom(){
  if (!NET_OK) return toast('통신 기능을 못 불러왔어요. 새로고침 해주세요.', 3000);
  mode = 'host'; isHost = true; showPane('pHost');
  $('hostWait').className = 'wait'; $('hostWait').textContent = '상대를 기다리는 중…';
  tryHost(0);
}
function tryHost(n){
  const code = String(Math.floor(1000 + Math.random() * 9000));
  $('roomCode').textContent = code; hostRoom.code = code;
  if (peer){ try { peer.destroy(); } catch(e){} }
  peer = new Peer(PEER_PREFIX + code, { debug:0 });
  peer.on('error', err => {
    if (err && err.type === 'unavailable-id' && n < 5) return tryHost(n + 1);
    $('hostWait').className = 'wait err';
    $('hostWait').textContent = '연결 서버에 접속하지 못했어요. 잠시 후 다시 해주세요.';
  });
  peer.on('connection', c => { conn = c; c.on('open', () => { bindConn(); onPaired(); }); });
}
function joinRoom(code){
  if (!NET_OK) return toast('통신 기능을 못 불러왔어요. 새로고침 해주세요.', 3000);
  mode = 'guest'; isHost = false;
  $('joinWait').className = 'wait'; $('joinWait').textContent = '접속하는 중…';
  if (peer){ try { peer.destroy(); } catch(e){} }
  peer = new Peer({ debug:0 });
  peer.on('open', () => {
    conn = peer.connect(PEER_PREFIX + code, { reliable:true });
    conn.on('open', () => { bindConn(); onPaired(); });
  });
  peer.on('error', err => {
    $('joinWait').className = 'wait err';
    $('joinWait').textContent = (err && err.type === 'peer-unavailable')
      ? '그 코드의 방을 찾을 수 없어요. 숫자를 다시 확인해주세요.'
      : '연결에 실패했어요. 잠시 후 다시 해주세요.';
  });
}
function bindConn(){
  conn.on('data', onData);
  conn.on('close', () => {
    toast('상대와 연결이 끊어졌어요', 3500);
    setPlayerVisible(foe, false); mode = 'solo';
  });
}
function onPaired(){
  toast('상대와 연결됐어요!');
  showPane('pReady'); $('readyWait').textContent = '';
  send({ t:'hi', c:myColor });
}
function applyFoeColor(){
  if (foeColor === myColor) foeColor = (myColor + 1) % SKIN.length;
  foe.shirt.color.setHex(SKIN[foeColor].hex);
}
function startGame(){
  $('lobby').classList.remove('on');
  $('hud').classList.add('on');
  $('pad').classList.add('on');
  setPlayerVisible(foe, mode !== 'solo');
  me.it = (mode !== 'solo') && isHost;                 // 방장이 첫 술래
  foe.it = (mode !== 'solo') && !isHost;
  toast(mode === 'solo' ? '자유롭게 둘러보세요!' : (me.it ? '내가 술래! 쫓아가세요' : '도망치세요!'), 3000);
}

function onData(m){
  if (!m || !m.t) return;
  switch (m.t){
    case 'hi':  foeColor = m.c; applyFoeColor(); send({ t:'hi2', c:myColor }); break;
    case 'hi2':
    case 'color': foeColor = m.c; applyFoeColor(); break;
    case 'ready':
      foeReady = true;
      $('readyWait').textContent = myReady ? '시작합니다!' : '상대가 준비됐어요!';
      if (isHost && myReady){ send({ t:'go' }); startGame(); }
      break;
    case 'go': startGame(); break;
    case 's':
      foeTarget = m;
      foe.hp = m.h; foe.down = !!m.dn; foe.anim = m.a; foe.it = !!m.it;
      if (m.c >= 0 && m.c < cars.length){                 // 상대가 탈것에 탄 상태
        cars[m.c].driver = 1; cars[m.c].x = m.x; cars[m.c].z = m.z; cars[m.c].yaw = m.r;
        foe.onBike = cars[m.c].spec.bike;                 // 오토바이면 탄 모습이 보임
        setPlayerVisible(foe, foe.onBike);
      } else {
        foe.onBike = false;
        setPlayerVisible(foe, true);
        for (const c of cars) if (c.driver === 1) c.driver = -1;
      }
      break;
    case 'atk': foe.atkT = WEAPONS[m.k] ? WEAPONS[m.k].cd : 0.3; foe.atkKind = m.k; break;
    case 'hit': takeDamage(m.d, m.kx, m.kz); break;
    case 'shot': spawnShot(m.x, m.y, m.z, m.dx, m.dz, m.k, false); break;
    case 'down': foe.down = true; break;
    case 'tag': me.it = true; foe.it = false; me.tagCool = 3; toast('잡혔다! 내가 술래'); break;
    case 'car': if (m.i >= 0 && m.i < cars.length) cars[m.i].driver = 1; break;
    case 'npc': {                                    // 방장이 보내주는 행인 위치
      const a = m.a || [];
      for (let i = 0; i < npcs.length && i * 4 + 3 < a.length; i++){
        const n = npcs[i];
        n.ttx = a[i * 4]; n.ttz = a[i * 4 + 1];
        n.yaw = a[i * 4 + 2]; n.state = a[i * 4 + 3];
      }
      break;
    }
    case 'nhit': knockNpc(m.i, m.dx, m.dz); break;   // 참가자가 때린 행인
  }
}

/* =====================================================================
   12. UI
   ===================================================================== */
function bindUI(){
  const wrap = $('colors');
  SKIN.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'swatch' + (i === 0 ? ' sel' : '');
    d.style.background = '#' + c.hex.toString(16).padStart(6, '0');
    d.onclick = () => {
      myColor = i;
      wrap.querySelectorAll('.swatch').forEach((s, j) => s.classList.toggle('sel', j === i));
      me.shirt.color.setHex(c.hex); applyFoeColor(); send({ t:'color', c:i });
    };
    wrap.appendChild(d);
  });

  $('bHost').onclick = hostRoom;
  $('bJoin').onclick = () => { showPane('pJoin'); $('joinWait').textContent = ''; $('codeInput').focus(); };
  $('bSolo').onclick = () => { mode = 'solo'; startGame(); };
  $('bHostBack').onclick = $('bJoinBack').onclick = () => {
    if (peer){ try { peer.destroy(); } catch(e){} peer = null; conn = null; }
    showPane('pMenu');
  };
  $('bConnect').onclick = () => {
    const v = $('codeInput').value.trim();
    if (!/^\d{4}$/.test(v)) return toast('숫자 4자리를 입력해주세요');
    joinRoom(v);
  };
  $('bCopy').onclick = () => {
    const url = location.origin + location.pathname + '?room=' + hostRoom.code;
    if (navigator.clipboard) navigator.clipboard.writeText(url)
      .then(() => toast('링크를 복사했어요!'), () => prompt('이 주소를 보내세요', url));
    else prompt('이 주소를 보내세요', url);
  };
  $('bGo').onclick = () => {
    myReady = true; $('bGo').disabled = true;
    $('readyWait').textContent = foeReady ? '시작합니다!' : '상대를 기다리는 중…';
    send({ t:'ready' });
    if (isHost && foeReady){ send({ t:'go' }); startGame(); }
  };
}

function updateHUD(){
  $('hpFill').style.width = Math.max(0, me.hp) + '%';
  $('hpFill').style.background = me.hp > 55 ? '#5ddc7f' : me.hp > 25 ? '#ffd24a' : '#ff6b6b';
  const w = WEAPONS[me.weapon];
  $('weapon').textContent = w.name + (w.throw ? ' ×' + me.ammo : '');
  const tb = $('tagBox');
  if (mode === 'solo'){ tb.textContent = '자유 탐험'; tb.className = 'panel'; }
  else if (me.it){ tb.textContent = '내가 술래!'; tb.className = 'panel it'; }
  else { tb.textContent = '도망쳐!'; tb.className = 'panel run'; }
  const sp = $('speedo');
  if (me.car >= 0){
    sp.style.visibility = 'visible';
    sp.textContent = Math.round(Math.abs(cars[me.car].speed) * 3.6) + ' km/h';
  } else sp.style.visibility = 'hidden';
}

/* =====================================================================
   13. 메인 루프
   ===================================================================== */
let prev = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.033, (now - prev) / 1000) || 0.016;
  prev = now;

  if ($('hud').classList.contains('on')){
    updateMe(dt);
    if (me.kx || me.kz){                                   // 맞고 밀려남
      me.x += me.kx * dt; me.z += me.kz * dt;
      me.kx *= 0.86; me.kz *= 0.86;
      if (Math.abs(me.kx) < 0.1) me.kx = me.kz = 0;
      collideBoxes(me, P.radius);
    }
  }

  drawPlayer(me, dt);

  if (mode !== 'solo' && foeTarget){
    const k = 1 - Math.exp(-dt * 12);
    foe.x += (foeTarget.x - foe.x) * k;
    foe.y += (foeTarget.y - foe.y) * k;
    foe.z += (foeTarget.z - foe.z) * k;
    let d = foeTarget.r - foe.yaw;
    while (d > Math.PI) d -= TAU;
    while (d < -Math.PI) d += TAU;
    foe.yaw += d * k;
    if (foe.atkT > 0) foe.atkT -= dt;
    if (foe.anim === 1) foe.animT += dt * P.runAnim;
    drawPlayer(foe, dt);
  }

  updateShots(dt);
  if (mode === 'guest') smoothNpcs(dt); else updateNpcs(dt);
  drawNpcs();
  for (const pk of pickups) pk.mesh.rotation.y += dt * 2;
  drawCars();
  updateCamera(dt);
  updateHUD();

  if (mode !== 'solo' && now - lastSend > 50){
    lastSend = now;
    send({ t:'s', x:me.x, y:me.y, z:me.z, r:me.yaw, a:me.anim,
           c:me.car, h:me.hp, dn:me.down ? 1 : 0, it:me.it ? 1 : 0 });
  }
  if (mode === 'host' && now - npcSend > 125){          // 행인 위치는 방장이 기준
    npcSend = now;
    const a = [];
    for (const n of npcs)
      a.push(Math.round(n.x * 10) / 10, Math.round(n.z * 10) / 10,
             Math.round(n.yaw * 100) / 100, n.state);
    send({ t:'npc', a });
  }
  renderer.render(scene, camera);
}
</script>
</body>
</html>
